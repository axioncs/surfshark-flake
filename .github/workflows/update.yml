name: Check for Surfshark updates

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: surfshark-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run update script
        id: update
        run: |
          ./update.sh
          if git diff --quiet -- version.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            v=$(jq -r '.version' version.json)
            echo "summary=${v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify build
        if: steps.update.outputs.changed == 'true'
        run: nix build .#default --print-build-logs

      - name: Commit and push
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: bump surfshark (${{ steps.update.outputs.summary }})"
          git push
